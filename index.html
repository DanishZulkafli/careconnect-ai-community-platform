<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Career Skill Matcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>🤖 AI Career Skill Matcher</h1>
      <p class="subtitle">
        Select your current skills and discover which tech career role matches you best.
      </p>

      <div class="skills-grid">
        <label><input type="checkbox" value="html"> HTML</label>
        <label><input type="checkbox" value="css"> CSS</label>
        <label><input type="checkbox" value="javascript"> JavaScript</label>
        <label><input type="checkbox" value="php"> PHP</label>
        <label><input type="checkbox" value="wordpress"> WordPress</label>
        <label><input type="checkbox" value="woocommerce"> WooCommerce</label>
        <label><input type="checkbox" value="python"> Python</label>
        <label><input type="checkbox" value="sql"> SQL</label>
        <label><input type="checkbox" value="machine-learning"> Machine Learning</label>
        <label><input type="checkbox" value="uiux"> UI/UX</label>
        <label><input type="checkbox" value="git"> Git/GitHub</label>
        <label><input type="checkbox" value="api"> API Integration</label>
      </div>

      <button onclick="matchCareer()">Find My Career Match</button>

      <div id="result" class="result hidden"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
